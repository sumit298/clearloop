
version: 2

updates:
  - package-ecosystem: npm
    directory: /clearloop-backend
    schedule:
      interval: weekly
    groups:
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"
      backend-routine:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /clearloop-frontend
    schedule:
      interval: weekly
    groups:
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"
      frontend-routine:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
